name: Build Goal Challenge Android APK

on:
  workflow_dispatch:        # manuell über den Actions-Tab starten
  push:
    branches:
      - main                # bei jeder Änderung auf main
  release:
    types: [published]      # beim Veröffentlichen eines Releases -> APK wird angehängt

permissions:
  contents: write           # nötig, um die APK an ein Release zu hängen

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android-SDK-Pakete installieren
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Godot 4.4.1 inkl. Export-Templates installieren
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true   # ohne Templates kein Android-Export

      - name: Godot die SDK-Pfade mitteilen
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          cat ~/.config/godot/editor_settings-4.4.tres

      - name: Debug-Keystore erzeugen
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -deststoretype pkcs12 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Projekt importieren
        run: godot --headless --path . --import

      - name: APK bauen
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build
          godot --headless --path . --export-debug "Android" "$PWD/build/GoalChallenge.apk"
          # Godot meldet Fehler nicht immer per Exit-Code -> selbst prüfen
          test -f build/GoalChallenge.apk
          ls -lh build/

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Goal-Challenge-Android
          path: build/GoalChallenge.apk

      - name: APK an Release anhängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/GoalChallenge.apk
